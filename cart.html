<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Your Basket | Sunehri Dairy</title><link rel="stylesheet" href="style.css"><script src="script.js" defer></script></head>
<body><div id="site-header"></div><main class="page-main"><section class="page-intro compact-intro"><p class="eyebrow">Your good things</p><h1>Your basket<span class="title-dot">.</span></h1><p>Take a look at what's coming to your table.</p></section>
  <section class="cart-layout section-wrap"><div class="cart-items" id="cart-items" aria-live="polite"></div><aside class="order-summary"><h2>Order summary</h2><div class="summary-line"><span>Subtotal</span><strong id="cart-subtotal">₹0</strong></div><div class="summary-line"><span>Delivery</span><strong id="cart-delivery">₹0</strong></div><div class="coupon-area"><label for="coupon-code">Have a coupon?</label><div class="coupon-entry"><input id="coupon-code" type="text" placeholder="Enter code" autocomplete="off"><button id="apply-coupon" class="button button-outline" type="button">Apply</button></div><p class="form-message" id="coupon-message" aria-live="polite"></p></div><div class="summary-line discount-line" id="discount-row" hidden><span>Discount</span><strong id="cart-discount">−₹0</strong></div><div class="summary-line total-line"><span>Total</span><strong id="cart-total">₹0</strong></div><p class="delivery-note" id="delivery-note">Delivery is free on orders of ₹500 or more.</p><a class="button button-dark full-button" id="checkout-link" href="checkout.html">Continue to checkout <span aria-hidden="true">&#8594;</span></a><a class="continue-link" href="products.html">Continue shopping</a></aside></section>
</main><div id="site-footer"></div></body></html>
